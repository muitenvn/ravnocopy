name: Push to Ravno-App
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: src
      - uses: actions/checkout@v4
        with:
          repository: muitenvn/Ravno-App
          token: ${{ secrets.SYNC_TOKEN }}
          path: dst
          fetch-depth: 0
      - name: Copy to branch remix-sync
        working-directory: dst
        run: |
          git config user.name "sync-bot"
          git config user.email "sync-bot@users.noreply.github.com"
          git checkout -B remix-sync origin/main
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf {} +
          rsync -a --exclude .git --exclude .github ../src/ ./
          git add -A
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "sync: ravnocopy ${GITHUB_SHA::7}"
          git push --force origin remix-sync
