name: Push to Ravno-App
on:
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: sync-to-main-repo
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository != 'muitenvn/Ravno-App'
    runs-on: ubuntu-latest
    steps:
      - name: Verify SYNC_TOKEN secret
        env:
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          if [ -z "$SYNC_TOKEN" ]; then
            echo "::error::Missing SYNC_TOKEN secret in repository Actions secrets."
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          path: src
      - uses: actions/checkout@v4
        with:
          repository: muitenvn/Ravno-App
          token: ${{ secrets.SYNC_TOKEN }}
          path: dst
          fetch-depth: 0
      - name: Sync directly to main branch
        working-directory: dst
        run: |
          git config user.name "sync-bot"
          git config user.email "sync-bot@users.noreply.github.com"
          TARGET_BRANCH=$(git symbolic-ref --short HEAD 2>/dev/null || echo "main")
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf {} +
          rsync -a --exclude .git --exclude .github ../src/ ./
          git add -A
          if git diff --cached --quiet; then echo "No changes compared to ${TARGET_BRANCH}"; exit 0; fi
          git commit -m "sync: ravnocopy ${GITHUB_SHA::7}"
          git push origin "HEAD:${TARGET_BRANCH}"
          echo "Synced successfully to muitenvn/Ravno-App (branch: ${TARGET_BRANCH})"
